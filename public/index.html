<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AWS 文件与 CDN</title><link rel="stylesheet" href="/style.css"><script defer src="/icons.js"></script><script type="module" src="/app.js"></script></head>
<body><header><strong>AWS 文件与 CDN</strong><nav><button id="s3Tab">S3 文件</button><button id="cfTab">CloudFront</button><a href="/gcp">GCP 文件与 CDN</a></nav><button id="disconnect" hidden>断开连接</button></header>
<main><section id="login"><h1>连接 AWS</h1><form id="connectForm"><label>Access Key<input id="access" required autocomplete="off"></label><label>Secret Key<input id="secret" type="password" required autocomplete="off"></label><label>Session Token（可选）<input id="token" type="password" autocomplete="off"></label><button class="primary">连接</button></form></section>
<div id="notice" role="status" aria-live="polite"></div><div id="checks"></div>
<section id="s3" hidden><form id="locateForm" class="toolbar"><label for="resourceUrl">通过链接定位</label><input id="resourceUrl" placeholder="https://cdn.example.com/assets/file.png" required autocomplete="off"><button id="locateButton" type="submit"><i data-lucide="map-pin"></i> 定位</button></form><div id="locateResults" aria-live="polite"></div><div id="bucketView"><h1>存储桶</h1><input id="bucketSearch" placeholder="搜索 Bucket 名称"><div id="buckets"></div></div>
<div id="fileView" hidden><div class="toolbar"><button id="back" title="返回存储桶"><i data-lucide="arrow-left"></i></button><div id="crumbs"></div><button id="refresh" title="刷新"><i data-lucide="refresh-cw"></i></button><label>区域<input id="region" list="regions" placeholder="自动识别"></label><datalist id="regions"><option value="ap-south-1">印度孟买</option><option value="ap-south-2">印度海得拉巴</option><option value="us-east-1"><option value="ap-southeast-1"><option value="ap-east-1"></datalist></div>
<div class="toolbar"><span id="selection">0 项已选</span><button id="newFolder">新建文件夹</button><button id="copy">复制</button><button id="move">移动</button><button id="delete">删除</button></div>
<div class="tableWrap"><table><thead><tr><th><input id="selectAll" type="checkbox" aria-label="全选"></th><th>名称</th><th>大小</th><th>修改时间</th></tr></thead><tbody id="objects"></tbody></table></div><button id="more" hidden>加载更多</button>
<div id="drop"><i data-lucide="upload"></i><strong>拖放文件或文件夹到当前目录</strong><div><button id="chooseFiles">选择文件</button><button id="chooseFolder">选择文件夹</button></div><input id="files" type="file" multiple hidden><input id="folder" type="file" webkitdirectory multiple hidden></div></div></section>
<section id="cf" hidden><h1>CloudFront 缓存失效</h1><form id="searchForm" class="toolbar"><input id="domain" placeholder="域名或 URL" required><button>搜索分配</button></form><div id="distributions"></div><form id="invalidateForm"><label>失效路径<textarea id="paths" rows="6" placeholder="/index.html&#10;/assets/*" required></textarea></label><button class="primary">提交失效</button></form><div id="invalidations"></div></section>
<section id="activity" hidden><h2>任务</h2><button id="retry" hidden>重试失败文件</button><div id="tasks"></div></section></main>
<dialog id="modal"><form id="modalForm"><h2 id="modalTitle"></h2><p id="modalDescription"></p><div id="folderFields" hidden><label>文件夹名称<input id="folderName" placeholder="例如 images" autocomplete="off"></label><small>将在当前目录创建一个以 / 结尾的 S3 文件夹标记对象。</small></div><div id="targetFields"><label>目标 Bucket<input id="targetBucket" list="bucketOptions" required></label><datalist id="bucketOptions"></datalist><label>目标目录<input id="targetPrefix" placeholder="例如 releases/"></label><label>目标区域（自动识别失败时填写）<input id="targetRegion" list="regions"></label></div><label id="overwriteLabel"><input id="overwrite" type="checkbox">覆盖同名对象（默认跳过）</label><p id="publicWarning" hidden>上传强制 public-read，文件将公开可读。禁止公开访问或禁用 ACL 时上传会失败。</p><div class="toolbar"><button type="button" id="cancelModal">取消</button><button class="primary">确认执行</button></div></form></dialog>
<dialog id="failureDialog"><form method="dialog"><div class="dialogHeader"><h2 id="failureTitle">失败项</h2><button type="submit" title="关闭">关闭</button></div><p id="failureSummary"></p><div class="failureTableWrap"><table><thead><tr><th>对象</th><th>目标</th><th>状态</th><th>错误</th></tr></thead><tbody id="failureItems"></tbody></table></div></form></dialog></body></html>
